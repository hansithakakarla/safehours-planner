# Render Blueprint: creates the FastAPI backend and the React frontend together.
# In Render: New + > Blueprint > pick this repo > Apply.
services:
  - type: web
    name: safehours-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: safehours-web
          property: host

  - type: web
    name: safehours-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: safehours-api
          property: host
